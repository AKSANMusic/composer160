[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "composer160"
version = "0.1.0"
description = "COMPOSER-160 Music Direction Engine — AKSAN Edition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["google-genai>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
composer160 = "composer160.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/composer160"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
